{% extends "base.html" %}

{% block title %}
Login | SkillBridge AI
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-6 col-lg-5">

        <div class="card p-4">

            <div class="text-center mb-4">

                <h2 class="fw-bold">
                    Welcome Back
                </h2>

                <p class="text-muted">
                    Continue your career journey.
                </p>

            </div>

            <form method="POST">

                <div class="mb-3">

                    <label class="form-label">
                        Email
                    </label>

                    <input
                        type="email"
                        name="email"
                        class="form-control"
                        placeholder="Enter your email"
                        required
                    >

                </div>

                <div class="mb-4">

                    <label class="form-label">
                        Password
                    </label>

                    <input
                        type="password"
                        name="password"
                        class="form-control"
                        placeholder="Enter your password"
                        required
                    >

                </div>

                <button
                    type="submit"
                    class="btn btn-primary w-100">
                    Login
                </button>

            </form>

            <div class="text-center mt-4">

                <span class="text-muted">
                    Don't have an account?
                </span>

                <a href="{{ url_for('auth.register') }}">
                    Create Account
                </a>

            </div>

        </div>

    </div>

</div>

{% endblock %}
